<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reeflex - A fast-paced keyboard reflex game. Press the right keys before time runs out. How high can you score in 30 seconds?">
    <meta name="theme-color" content="#0a000e">

    <meta property="og:title" content="Reeflex - Keyboard Reflex Game">
    <meta property="og:description" content="A fast-paced keyboard reflex game. Press the right keys before time runs out!">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://abdullah-ghazi0.github.io/Reflex-Game/">
    <meta property="og:image" content="https://abdullah-ghazi0.github.io/Reflex-Game/static/preview.png">

    <title>Reeflex</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="static/favicon.ico" height="36" alt="logo">
            <h1>Reeflex</h1>
        </div>
        <a href="https://forms.gle/smnhjVXCeTQ212Ue7" target="_blank">Feedback</a>
    </header>
    <div class="warning">
        This game is designed for physical keyboards. 
        Mobile and touch-only devices are not supported. 
        Please use a desktop or connect an external keyboard to play.
    </div>
    <div class="infoBar">
        <div class="scores highScore">High Score: <span id="highScore"></span></div>
        <button id="start" class="clickable">Start</button>
        <div class="scores">Score: <span id="currentScore"></span></div>
    </div>
    <div id="display"></div>
    <div id="input"></div>

    <div class="timerBox">
        Time Left:
        <span id="timer">30</span>
    </div>

    <div class="modal-overlay">
        <div class="modal">
            <h2 id="modalTitle"></h2>
            <p class="modal-text">3</p>
            <a id="modalFb" href="https://forms.gle/smnhjVXCeTQ212Ue7" target="_blank"></a>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
